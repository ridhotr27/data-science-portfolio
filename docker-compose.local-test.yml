name: ridho-portfolio-local-test

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: ridho-portfolio-frontend:integration
    restart: unless-stopped
    networks: [app]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    cpus: "0.25"
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  backend:
    image: ridho-portfolio-backend:integration
    restart: unless-stopped
    networks: [app]
    expose: ["8000"]
    environment:
      ALLOWED_ORIGINS: http://localhost:8088
      FRONTEND_ORIGIN: http://localhost:8088
      DATASET_TTL_SECONDS: "900"
      MAX_DATASET_SESSIONS: "3"
      UPLOAD_RATE_LIMIT: "20"
      UPLOAD_RATE_WINDOW_SECONDS: "60"
      ENABLE_XGBOOST: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    cpus: "2.0"
    mem_limit: 1536m
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [app, edge]
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    cpus: "0.25"
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /config:size=8m
      - /data:size=8m
      - /tmp:size=8m,mode=1777
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

networks:
  app:
    driver: bridge
    internal: true
  edge:
    driver: bridge
