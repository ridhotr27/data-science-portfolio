name: Production SSH Connectivity Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    name: Verify restricted production SSH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.PROD_SSH_HOST }}
      DEPLOY_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
      DEPLOY_USER: ${{ vars.PROD_SSH_USER }}

    steps:
      - name: Verify public DNS and HTTPS from the runner
        run: |
          set -euo pipefail
          getent ahostsv4 ridhotrivo.com | grep -q '139.190.108.107'
          curl --fail --silent --show-error --max-time 15 https://ridhotrivo.com/ >/dev/null
          curl --fail --silent --show-error --max-time 15 https://ridhotrivo.com/api/health | grep -q '"status":"ok"'

      - name: Configure restricted SSH client
        env:
          DEPLOY_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_HOST_KEYS"
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/portfolio_deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/portfolio_deploy"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_HOST_KEYS" > "$HOME/.ssh/known_hosts"

      - name: Run safe SSH connectivity diagnostics
        run: |
          set -euo pipefail

          diagnostics_ok=true

          if getent ahosts "$DEPLOY_HOST" >/dev/null 2>&1; then
            echo "dns_resolution=success"
          else
            echo "dns_resolution=failure"
            diagnostics_ok=false
          fi

          if timeout 10 bash -c 'exec 3<>/dev/tcp/"$1"/"$2"' \
            _ "$DEPLOY_HOST" "$DEPLOY_PORT" 2>/dev/null; then
            echo "tcp_connectivity=success"
          else
            echo "tcp_connectivity=failure"
            diagnostics_ok=false
          fi

          if ssh-keygen -y -P '' -f "$HOME/.ssh/portfolio_deploy" \
            >/dev/null 2>&1; then
            echo "private_key_parse=success"
          else
            echo "private_key_parse=failure"
            diagnostics_ok=false
          fi

          if ssh-keygen -l -f "$HOME/.ssh/known_hosts" \
            >/dev/null 2>&1; then
            echo "known_hosts_structure=valid"
          else
            echo "known_hosts_structure=invalid"
            diagnostics_ok=false
          fi

          if [[ "$diagnostics_ok" != true ]]; then
            echo "ssh_exit_status=not_run"
            echo "ssh_failure_category=preflight"
            exit 1
          fi

          set +e
          output="$(
            ssh -T \
              -p "$DEPLOY_PORT" \
              -i "$HOME/.ssh/portfolio_deploy" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" 2>&1
          )"
          status=$?
          set -e

          echo "ssh_exit_status=$status"

          if [[ "$status" -eq 64 ]] &&
            [[ "$output" == "Only the portfolio deployment command is allowed." ]]; then
            echo "ssh_failure_category=forced-command-rejection"
            echo "connectivity_test=success"
            exit 0
          fi

          if grep -Eqi \
            'Could not resolve hostname|Name or service not known|Connection timed out|Connection refused|No route to host|Network is unreachable' \
            <<<"$output"; then
            category=network
          elif grep -Eqi \
            'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED|No .* host key is known' \
            <<<"$output"; then
            category=host-key-verification
          elif grep -Eqi \
            'Load key|invalid format|error in libcrypto' \
            <<<"$output"; then
            category=key-parsing
          elif grep -Eqi \
            'Permission denied \(publickey\)|no mutual signature algorithm|sign_and_send_pubkey' \
            <<<"$output"; then
            category=authentication
          elif grep -Fq \
            'Only the portfolio deployment command is allowed.' \
            <<<"$output"; then
            category=forced-command-rejection
          else
            category=unclassified
          fi

          echo "ssh_failure_category=$category"
          echo "connectivity_test=failure"
          exit 1
