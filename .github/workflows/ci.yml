name: CI, Images, and Gated Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Main deployments queue instead of cancelling a deployment in progress. Pull
# request runs may still cancel superseded work.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgomp1

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  publish-frontend:
    name: Publish frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable frontend image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: VITE_ENABLE_XGBOOST=false
          tags: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish-backend:
    name: Publish backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable backend image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy-production:
    name: Deploy exact digests to production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: [publish-frontend, publish-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-ridhotrivo
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      FRONTEND_REF: ghcr.io/${{ github.repository }}-frontend@${{ needs.publish-frontend.outputs.digest }}
      BACKEND_REF: ghcr.io/${{ github.repository }}-backend@${{ needs.publish-backend.outputs.digest }}
      DEPLOY_HOST: ${{ vars.PROD_SSH_HOST }}
      DEPLOY_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
      DEPLOY_USER: ${{ vars.PROD_SSH_USER }}
    steps:
      - name: Require deployment configuration
        env:
          DEPLOY_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_HOST_KEYS"
          [[ "$FRONTEND_REF" == ghcr.io/${GITHUB_REPOSITORY}-frontend@sha256:* ]]
          [[ "$BACKEND_REF" == ghcr.io/${GITHUB_REPOSITORY}-backend@sha256:* ]]

      - name: Configure restricted SSH client
        env:
          DEPLOY_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/portfolio_deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/portfolio_deploy"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_HOST_KEYS" > "$HOME/.ssh/known_hosts"

      - name: Deploy frontend and backend digests
        run: |
          set -euo pipefail
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/portfolio_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            deploy "$FRONTEND_REF" "$BACKEND_REF"

      - name: Verify public apex health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 https://ridhotrivo.com/api/health
