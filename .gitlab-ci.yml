stages:
  - test
  - build
  - deploy
  - verify

default:
  interruptible: true

backend_test:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install --no-install-recommends -y libgomp1 && rm -rf /var/lib/apt/lists/*
    - python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt
  script:
    - cd backend
    - python -m pytest -q

frontend_build_test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    when: always
    expire_in: 1 day
    paths: [dist/]

.docker_build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH'

build_frontend:
  extends: .docker_build
  needs: [frontend_build_test]
  script:
    - export FRONTEND_IMAGE="$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    - docker build --pull --file Dockerfile.frontend --tag "$FRONTEND_IMAGE" --build-arg VITE_ENABLE_XGBOOST=false .
    - docker push "$FRONTEND_IMAGE"

build_backend:
  extends: .docker_build
  needs: [backend_test]
  script:
    - export BACKEND_IMAGE="$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - docker build --pull --file backend/Dockerfile --tag "$BACKEND_IMAGE" backend
    - docker push "$BACKEND_IMAGE"

.ssh_setup:
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - if [ -f "$SSH_PRIVATE_KEY" ]; then chmod 600 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -; fi
    - install -d -m 700 ~/.ssh
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

deploy_production:
  extends: .ssh_setup
  stage: deploy
  resource_group: production
  interruptible: false
  needs: [build_frontend, build_backend]
  environment:
    name: production
    url: https://$PRODUCTION_DOMAIN
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - test -n "$PRODUCTION_DOMAIN" && test -n "$ACME_EMAIL" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PATH"
    - export FRONTEND_IMAGE="$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    - export BACKEND_IMAGE="$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - set +x
    - |
      umask 077
      printf '%s\n' \
        "DOMAIN=$PRODUCTION_DOMAIN" \
        "ACME_EMAIL=$ACME_EMAIL" \
        "FRONTEND_IMAGE=$FRONTEND_IMAGE" \
        "BACKEND_IMAGE=$BACKEND_IMAGE" \
        "ALLOWED_ORIGINS=https://$PRODUCTION_DOMAIN" \
        "DATASET_TTL_SECONDS=${DATASET_TTL_SECONDS:-900}" \
        "MAX_DATASET_SESSIONS=${MAX_DATASET_SESSIONS:-3}" \
        "UPLOAD_RATE_LIMIT=${UPLOAD_RATE_LIMIT:-20}" \
        "UPLOAD_RATE_WINDOW_SECONDS=${UPLOAD_RATE_WINDOW_SECONDS:-60}" \
        "ENABLE_XGBOOST=false" \
        "VITE_ENABLE_XGBOOST=false" > .env.production
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 700 '$DEPLOY_PATH/deploy'; if [ -f '$DEPLOY_PATH/.env.production' ]; then cp '$DEPLOY_PATH/.env.production' '$DEPLOY_PATH/.env.production.previous'; fi"
    - scp docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
    - scp deploy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/Caddyfile"
    - scp .env.production "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.production"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 '$DEPLOY_PATH/.env.production'"
    - printf '%s' "$REGISTRY_DEPLOY_PASSWORD" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login '$CI_REGISTRY' --username '$REGISTRY_DEPLOY_USER' --password-stdin"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose --env-file .env.production -f docker-compose.prod.yml pull && docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-build --remove-orphans"
  after_script:
    - rm -f .env.production

verify_production:
  stage: verify
  image: curlimages/curl:8.10.1
  needs: [deploy_production]
  environment:
    name: production
    url: https://$PRODUCTION_DOMAIN
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - |
      for attempt in 1 2 3 4 5 6; do
        curl --fail --silent --show-error --max-time 15 "https://$PRODUCTION_DOMAIN/" >/dev/null \
          && curl --fail --silent --show-error --max-time 15 "https://$PRODUCTION_DOMAIN/api/health" | grep -q '"status":"ok"' \
          && exit 0
        echo "Verification attempt $attempt failed; retrying..."
        sleep 10
      done
      echo "Production verification failed."
      exit 1
