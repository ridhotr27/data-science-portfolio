name: ridho-portfolio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env.production}
    restart: unless-stopped
    networks: [app]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.25"
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env.production}
    restart: unless-stopped
    networks: [app]
    expose: ["8000"]
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      FRONTEND_ORIGIN: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      DATASET_TTL_SECONDS: ${DATASET_TTL_SECONDS:-900}
      MAX_DATASET_SESSIONS: ${MAX_DATASET_SESSIONS:-3}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-20}
      UPLOAD_RATE_WINDOW_SECONDS: ${UPLOAD_RATE_WINDOW_SECONDS:-60}
      ENABLE_XGBOOST: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "2.0"
    mem_limit: 1536m
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [app, edge]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.25"
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

networks:
  app:
    driver: bridge
    internal: true
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
