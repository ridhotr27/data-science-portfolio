name: ridho-portfolio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env.production}
    restart: unless-stopped
    networks:
      app:
      edge:
        aliases: [portfolio-frontend]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env.production}
    restart: unless-stopped
    networks:
      app:
      edge:
        aliases: [portfolio-backend]
    expose: ["8000"]
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      FRONTEND_ORIGIN: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      DATASET_TTL_SECONDS: ${DATASET_TTL_SECONDS:-900}
      MAX_DATASET_SESSIONS: ${MAX_DATASET_SESSIONS:-3}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-20}
      UPLOAD_RATE_WINDOW_SECONDS: ${UPLOAD_RATE_WINDOW_SECONDS:-60}
      ENABLE_XGBOOST: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "1.50"
    mem_limit: 1408m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

networks:
  app:
    driver: bridge
    internal: true
  edge:
    external: true
    name: caddy_edge
